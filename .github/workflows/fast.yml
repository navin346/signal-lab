# Fast lane: a paper bot that stays on and reacts within seconds of each hour (lab/fast.py).
# Each run lasts about five hours, then starts the next one. State lives on the fast-data branch.
name: fast
on:
  schedule:
    - cron: "25 */6 * * *"     # watchdog: restarts the chain if a run died
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["lab/fast.py", ".github/workflows/fast.yml"]

permissions:
  contents: write
  actions: write

concurrency:
  group: fast
  cancel-in-progress: false

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: restore state from the fast-data branch
        run: |
          if git fetch --depth 1 origin fast-data 2>/dev/null; then
            git show FETCH_HEAD:fast.json > fast.json || rm -f fast.json
          fi
      - name: run
        env:
          FAST_PUBLISH: "1"
        run: python -m lab.fast --minutes 290 --state fast.json
      - name: start the next run
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fast.yml --ref main
